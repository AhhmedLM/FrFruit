name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set; skipping Hugging Face Space sync."
            exit 0
          fi
          git push --force "https://AhmedLM1745:${HF_TOKEN}@huggingface.co/spaces/AhmedLM1745/frfruit-mcp" HEAD:refs/heads/main
